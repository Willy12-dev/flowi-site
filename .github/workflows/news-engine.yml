name: News Engine — daily AI carousel drafter

on:
  schedule:
    # Runs every day at 06:00 UTC (≈ 09:00 EAT / 02:00 ET).
    # GitHub Actions cron can drift by a few minutes — that's fine for this.
    - cron: "0 6 * * *"
  workflow_dispatch: # manual trigger from the Actions tab

# Need write access so the workflow can commit drafted specs back to the repo.
permissions:
  contents: write

# Avoid two runs racing if a manual trigger overlaps a scheduled one.
concurrency:
  group: news-engine
  cancel-in-progress: false

jobs:
  draft:
    name: Poll RSS · draft carousels · commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Opt into Node.js 24 for the action runtime — silences the
    # "Node 20 actions are deprecated" annotation. Doesn't change the
    # version our script runs on (still set explicitly in setup-node).
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN to push commits back.
          token: ${{ secrets.GITHUB_TOKEN }}
          # Need history for git diff/push to behave.
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run news engine
        env:
          # Provider keys — agent uses Gemini first if GEMINI_API_KEY is set
          # (free tier on Gemini 2.5 Flash: 250 RPD, plenty for 10/day).
          # Falls back to Anthropic if you set NEWS_ENGINE_PROVIDER=claude
          # in repo Variables.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Provider override (optional repo Variable: "gemini" or "claude")
          NEWS_ENGINE_PROVIDER: ${{ vars.NEWS_ENGINE_PROVIDER }}
          # Per-provider model overrides (optional repo Variables)
          NEWS_ENGINE_GEMINI_MODEL: ${{ vars.NEWS_ENGINE_GEMINI_MODEL }}
          NEWS_ENGINE_CLAUDE_MODEL: ${{ vars.NEWS_ENGINE_CLAUDE_MODEL }}
          # Email digest (all optional)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPS_EMAIL_TO: ${{ secrets.OPS_EMAIL_TO }}
          OPS_EMAIL_FROM: ${{ secrets.OPS_EMAIL_FROM }}
        run: node scripts/news-engine.mjs

      - name: Commit drafted specs
        run: |
          git config user.name "flowi-bot"
          git config user.email "bot@useflowi.app"
          git add content/carousel-specs/ content/news-engine-state.json
          if git diff --cached --quiet; then
            echo "Nothing to commit (no fresh items today)."
          else
            DATE=$(date -u +%Y-%m-%d)
            COUNT=$(git diff --cached --name-only -- 'content/carousel-specs/news-*.json' | wc -l | tr -d ' ')
            git commit -m "news: ${DATE} · ${COUNT} carousels drafted by the daily engine"
            git push
            echo "Committed and pushed ${COUNT} new draft(s)."
          fi
